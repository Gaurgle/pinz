[workspace]
resolver = "2"
members = ["crates/pinz-core", "crates/pinz-tui"]

[workspace.package]
version = "0.6.0"
edition = "2021"
# Set by the locked ratatui (0.30.2 declares 1.88.0). pinz-core itself has no
# dependencies and builds on far less, but the workspace is what people build.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaurgle/pinz"
homepage = "https://github.com/Gaurgle/pinz"
authors = ["Andreas Roos"]
keywords = ["tui", "ratatui", "notes", "kanban", "terminal"]
categories = ["command-line-utilities", "text-editors"]

# Shared dependency versions live here so every crate pins the same line.
# pinz-core stays std-only; renderer deps live here so each renderer pins the
# same line. ratatui re-exports its crossterm backend, so we take it from there
# rather than pinning a separate crossterm that could drift out of sync.
[workspace.dependencies]
ratatui = "0.30"
# The core, declared once. Both the path (used inside this workspace) and the
# version (what a published `pinz` depends on) live here, next to the workspace
# version they must match, so a release bump touches two adjacent lines instead
# of three scattered ones. Cargo enforces the match: a path dependency whose
# version requirement misses the crate beside it fails to resolve, so drift
# breaks the build rather than the publish.
pinz-core = { path = "crates/pinz-core", version = "0.6.0" }
