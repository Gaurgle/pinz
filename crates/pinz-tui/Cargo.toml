[package]
name = "pinz-tui"
description = "Terminal renderer for pinz (Ratatui)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pinz"
path = "src/main.rs"

[dependencies]
pinz-core = { path = "../pinz-core" }
ratatui = { workspace = true }

[dev-dependencies]
# The demo boards are a test-only fixture; enabling the feature here keeps it
# out of the shipped `pinz` binary.
pinz-core = { path = "../pinz-core", features = ["fixtures"] }
